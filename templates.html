<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="11 templates de CV professionnels modernes. Choisissez le design qui correspond à votre profil et téléchargez votre CV en PDF pour 2 000 FCFA.">
<meta http-equiv="X-Frame-Options" content="DENY">
<title>Modèles de CV — CVPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
/* ===== CVPro Design System ===== */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --teal:#0F6E56;--tm:#1D9E75;--tl:#5DCAA5;
  --dark:#0D1117;--dark2:#161B22;--dark3:#21262D;
  --white:#FAFAFA;--muted:#8B949E;--border:#30363D;
  --text:#E6EDF3;--text2:#C9D1D9;
  --gold:#EF9F27;--coral:#D85A30;--blue:#185FA5;
  --r:14px;--rs:8px;--rl:20px;
  --fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
html{font-family:var(--fb);background:var(--dark);color:var(--text);scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--fh)}
a{text-decoration:none;color:inherit}
.container{max-width:1160px;margin:0 auto;padding:0 24px}
/* NAVBAR */
.navbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(13,17,23,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);height:64px}
.nav-inner{display:flex;align-items:center;height:64px;max-width:1160px;margin:0 auto;padding:0 24px;gap:16px}
.logo{font-family:var(--fh);font-weight:800;font-size:1.3rem;color:var(--white);display:flex;align-items:center;gap:8px}
.logo .dot{width:10px;height:10px;background:var(--tl);border-radius:50%;flex-shrink:0}
.logo .acc{color:var(--tl)}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-links a{padding:8px 14px;border-radius:var(--rs);color:var(--muted);font-size:.88rem;transition:all .2s}
.nav-links a:hover,.nav-links a.on{background:var(--dark3);color:var(--white)}
.btn-cta{background:var(--tm);color:#fff;padding:9px 20px;border-radius:var(--rs);font-size:.88rem;font-weight:500;border:none;cursor:pointer;font-family:var(--fb);white-space:nowrap;transition:all .2s}
.btn-cta:hover{background:var(--teal)}
.burger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px;margin-left:auto}
.burger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px}
.nav-mob{display:none;padding:12px 24px 20px;border-top:1px solid var(--border);background:var(--dark2)}
.nav-mob a{display:block;padding:11px 0;color:var(--text2);border-bottom:1px solid var(--border);font-size:.95rem}
.nav-mob.open{display:block}
/* BUTTONS */
.btn-p{display:inline-flex;align-items:center;gap:8px;background:var(--tm);color:#fff;padding:12px 24px;border-radius:var(--r);font-size:.93rem;font-weight:500;border:none;cursor:pointer;font-family:var(--fb);transition:all .25s}
.btn-p:hover{background:var(--teal);transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,110,86,.35)}
.btn-s{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--text);padding:12px 24px;border-radius:var(--r);font-size:.93rem;border:1px solid var(--border);cursor:pointer;font-family:var(--fb);transition:all .2s}
.btn-s:hover{border-color:var(--muted);background:var(--dark3)}
/* SECTION */
.stag{display:inline-block;background:rgba(93,202,165,.12);border:1px solid rgba(93,202,165,.3);color:var(--tl);padding:6px 16px;border-radius:20px;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
/* FORMS */
.fgrp{margin-bottom:20px}
.flbl{display:block;font-size:.82rem;font-weight:500;color:var(--text2);margin-bottom:8px}
.req{color:var(--coral)}
.finp,.fsel,.ftxt{width:100%;background:var(--dark3);border:1px solid var(--border);border-radius:var(--rs);color:var(--text);font-family:var(--fb);font-size:.92rem;padding:11px 13px;outline:none;transition:border .2s}
.finp:focus,.fsel:focus,.ftxt:focus{border-color:var(--tl);box-shadow:0 0 0 3px rgba(93,202,165,.1)}
.finp::placeholder,.ftxt::placeholder{color:#444}
.ftxt{min-height:80px;resize:vertical;line-height:1.6}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* FOOTER */
.footer{background:var(--dark2);border-top:1px solid var(--border);padding:52px 0 26px}
.fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:48px;margin-bottom:32px}
.fb p{font-size:.85rem;color:var(--muted);margin-top:14px;line-height:1.75;max-width:280px}
.fc h4{font-size:.76rem;font-weight:700;color:var(--white);text-transform:uppercase;letter-spacing:.08em;margin-bottom:13px}
.fc a,.fc span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:8px;transition:color .2s}
.fc a:hover{color:var(--tl)}
.fb2{border-top:1px solid var(--border);padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.8rem;color:var(--muted)}
/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--dark2);border:1px solid var(--tl);color:var(--text);padding:12px 20px;border-radius:var(--rs);font-size:.86rem;z-index:999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{transform:translateY(0);opacity:1}
.toast.err{border-color:var(--coral)}
/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(12px);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--dark2);border:1px solid var(--border);border-radius:var(--rl);padding:40px;max-width:460px;width:100%;position:relative;animation:min .3s ease;max-height:90vh;overflow-y:auto}
@keyframes min{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.mcl{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer;line-height:1}
/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:26px}
.kpi{background:var(--dark2);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.kl{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:10px}
.kv{font-family:var(--fh);font-size:2rem;font-weight:700;color:var(--white);line-height:1}
.ks{font-size:.75rem;color:var(--tl);margin-top:5px}
/* TX TABLE */
.ttbl{width:100%;border-collapse:collapse;font-size:.84rem}
.ttbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:9px 0;border-bottom:1px solid var(--border);font-weight:500}
.ttbl td{padding:12px 0;border-bottom:1px solid rgba(48,54,61,.4);color:var(--text2)}
.ttbl tr:last-child td{border-bottom:none}
.badge{padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600}
.bok{background:rgba(29,158,117,.15);color:var(--tl)}
.bwt{background:rgba(239,159,39,.12);color:var(--gold)}
.bko{background:rgba(216,90,48,.12);color:var(--coral)}
/* TOGGLE */
.tog{width:44px;height:24px;background:var(--dark3);border-radius:12px;cursor:pointer;position:relative;border:1px solid var(--border);transition:background .25s;flex-shrink:0}
.tog.on{background:var(--tm);border-color:var(--tm)}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:white;border-radius:50%;transition:left .25s}
.tog.on::after{left:23px}
/* RESPONSIVE */
@media(max-width:900px){.fg{grid-template-columns:1fr;gap:28px}.frow{grid-template-columns:1fr}}
@media(max-width:680px){.nav-links,.btn-cta{display:none}.burger{display:flex}}

body{padding-top:64px}
.phdr{padding:72px 0 44px;text-align:center;background:var(--dark2);border-bottom:1px solid var(--border)}
.phdr h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;color:var(--white);margin-bottom:12px}
.phdr p{color:var(--muted);font-size:1rem;max-width:500px;margin:0 auto}
.tplsec{padding:52px 0 80px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px;justify-content:center}
.fbtn{padding:7px 18px;border-radius:30px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.84rem;cursor:pointer;font-family:var(--fb);transition:all .2s}
.fbtn:hover,.fbtn.on{border-color:var(--tl);color:var(--tl);background:rgba(93,202,165,.07)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;margin-bottom:36px}
.tc{background:var(--dark2);border:2px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:all .25s;position:relative}
.tc:hover{border-color:rgba(93,202,165,.4);transform:translateY(-4px)}
.tc.sel{border-color:var(--tl);box-shadow:0 0 0 4px rgba(93,202,165,.12)}
.tchk{position:absolute;top:10px;left:10px;width:24px;height:24px;background:var(--tl);border-radius:50%;display:none;align-items:center;justify-content:center;color:#062918;font-size:12px;font-weight:700;z-index:2}
.tc.sel .tchk{display:flex}
.tbdg{position:absolute;top:10px;right:10px;background:var(--gold);color:#1a1a1a;font-size:.67rem;font-weight:700;padding:3px 9px;border-radius:20px;z-index:2}
.tprev{height:145px;display:flex;align-items:center;justify-content:center;padding:14px}
.tmni{background:white;border-radius:6px;width:100px;padding:8px;overflow:hidden}
.tinfo{padding:12px 14px;border-top:1px solid var(--border)}
.tnm{font-family:var(--fh);font-size:.88rem;font-weight:600;color:var(--white);margin-bottom:3px}
.tds{font-size:.74rem;color:var(--muted);line-height:1.5}
.stickybar{position:fixed;bottom:0;left:0;right:0;background:var(--dark2);border-top:1px solid var(--border);padding:13px 24px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:50;flex-wrap:wrap}
.stickybar.show{display:flex}
</style>
</head>
<body>
<nav class="navbar" id="nb">
  <div class="nav-inner">
    <a href="index.html" class="logo"><span class="dot"></span>CV<span class="acc">Pro</span></a>
    <div class="nav-links">
      <a href="index.html">Accueil</a>
      <a href="templates.html" class="on">Modèles</a>
      <a href="create.html">Créer mon CV</a>
      <a href="tarifs.html">Tarifs</a>
    </div>
    <a href="create.html" class="btn-cta">Commencer →</a>
    <button class="burger" onclick="document.getElementById('nm').classList.toggle('open')"><span></span><span></span><span></span></button>
  </div>
  <div class="nav-mob" id="nm">
    <a href="index.html">Accueil</a><a href="templates.html">Modèles</a><a href="create.html">Créer mon CV</a><a href="tarifs.html">Tarifs</a>
  </div>
</nav>

<div class="phdr">
  <span class="stag">Nos modèles</span>
  <h1>Choisissez votre style</h1>
  <p>11 templates conçus pour tous les profils et secteurs professionnels.</p>
</div>

<div class="tplsec">
  <div class="container">
    <div class="filters">
      <button class="fbtn on" onclick="filter('all',this)">Tous</button>
      <button class="fbtn" onclick="filter('color',this)">Colorés</button>
      <button class="fbtn" onclick="filter('minimal',this)">Minimaux</button>
      <button class="fbtn" onclick="filter('dark',this)">Sombres</button>
    </div>
    <div class="tgrid" id="grid"></div>
    <div style="text-align:center;padding-top:28px;border-top:1px solid var(--border)">
      <button class="btn-p" onclick="use()">Utiliser ce modèle →</button>
    </div>
  </div>
</div>

<div class="stickybar" id="sbar">
  <span style="font-size:.9rem;color:var(--text2)">Modèle sélectionné : <strong id="snm" style="color:var(--tl)">—</strong></span>
  <button class="btn-p" onclick="use()">Utiliser ce modèle →</button>
</div>

<footer class="footer">
  <div class="container">
    <div class="fb2" style="border:none;padding:0"><span>© 2026 CVPro · Tous droits réservés</span><span>2 000 FCFA par téléchargement</span></div>
  </div>
</footer>
<div class="toast" id="toast"></div>
<script>

const TPL = [
  {id:'modern',    name:'Modern Pro',      emoji:'🎨', desc:'Sidebar teal, bicolonne élégant',       badge:'Populaire', col:'#0F6E56', tag:'color'},
  {id:'minimal',   name:'Clean Minimal',   emoji:'⬜', desc:'Blanc pur, typographie bold',            badge:'',          col:'#1a1a1a', tag:'minimal'},
  {id:'teal',      name:'Teal Créatif',    emoji:'🌊', desc:'Accent turquoise sur fond clair',       badge:'',          col:'#1D9E75', tag:'color'},
  {id:'corporate', name:'Corporate',       emoji:'💼', desc:'Style grandes entreprises',             badge:'Pro',       col:'#0F6E56', tag:'color'},
  {id:'blue',      name:'Académique Bleu', emoji:'📘', desc:'Bandes bleues, style ingénieur',        badge:'',          col:'#185FA5', tag:'color'},
  {id:'dark',      name:'Slate Premium',   emoji:'🌙', desc:'Fond sombre, accents cyan',             badge:'',          col:'#1e2a3a', tag:'dark'},
  {id:'editorial', name:'Éditorial',       emoji:'📰', desc:'Bordure noire, style magazine',         badge:'',          col:'#1a1a1a', tag:'minimal'},
  {id:'warm',      name:'Terracotta',      emoji:'🏜', desc:'Tons sable et terracotta',              badge:'Nouveau',   col:'#D85A30', tag:'color'},
  {id:'bold',      name:'Bold Impact',     emoji:'⚫', desc:'Sidebar noir, contraste maximal',       badge:'',          col:'#111',    tag:'dark'},
  {id:'pastel',    name:'Pastel Indigo',   emoji:'🌸', desc:'Palette lavande douce',                 badge:'',          col:'#4F46E5', tag:'minimal'},
  {id:'classique', name:'Classique Pro',   emoji:'📄', desc:'Fond blanc, titres bleu marine, sobre', badge:'Nouveau',   col:'#1A3A6B', tag:'minimal'},
];

let sel = localStorage.getItem('cvpro_tpl') || 'modern';

function render(f) {
  const g = document.getElementById('grid');
  g.innerHTML = TPL.filter(t => f==='all' || t.tag===f).map(t => `
    <div class="tc${sel===t.id?' sel':''}" id="tc_${t.id}" onclick="pick('${t.id}','${t.name}')">
      <div class="tchk">✓</div>
      ${t.badge ? `<div class="tbdg">${t.badge}</div>` : ''}
      <div class="tprev" style="background:${t.col}20">
        <div class="tmni">
          <div style="background:${t.col};height:16px;border-radius:3px 3px 0 0;margin:-8px -8px 6px;display:flex;align-items:center;padding:0 6px;gap:4px">
            <div style="width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25)"></div>
            <div style="height:3px;background:rgba(255,255,255,.4);border-radius:2px;flex:1"></div>
          </div>
          <div style="height:4px;background:#ddd;border-radius:2px;margin-bottom:3px;width:90%"></div>
          <div style="height:3px;background:#eee;border-radius:2px;margin-bottom:3px;width:70%"></div>
          <div style="height:3px;background:#eee;border-radius:2px;margin-bottom:7px;width:85%"></div>
          <div style="height:3px;background:${t.col};border-radius:2px;opacity:.5;margin-bottom:2px"></div>
          <div style="height:3px;background:${t.col};border-radius:2px;opacity:.3;width:75%"></div>
        </div>
      </div>
      <div class="tinfo"><div class="tnm">${t.emoji} ${t.name}</div><div class="tds">${t.desc}</div></div>
    </div>`).join('');
}

function pick(id, name) {
  sel = id; localStorage.setItem('cvpro_tpl', id);
  document.querySelectorAll('.tc').forEach(c=>c.classList.remove('sel'));
  document.getElementById('tc_'+id)?.classList.add('sel');
  document.getElementById('snm').textContent = name;
  document.getElementById('sbar').classList.add('show');
  const t = document.getElementById('toast');
  t.textContent = 'Modèle "' + name + '" sélectionné ✓';
  t.className = 'toast show';
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'),3000);
}

function filter(f, btn) {
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on'); render(f);
}
function use() { window.location.href='create.html'; }

render('all');
const ct = TPL.find(x=>x.id===sel);
if (ct) { document.getElementById('snm').textContent = ct.name; document.getElementById('sbar').classList.add('show'); }
</script>
</body>
</html>
